spring:
  application:
    name: media-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:blogverse_media;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb+srv://blogverse_admin:Raghav21@cluster0.5lryr4c.mongodb.net/blogverse?retryWrites=true&w=majority}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${MEDIA_SERVICE_PORT:8085}

aws:
  s3:
    access-key-id: ${AWS_ACCESS_KEY_ID:minioadmin}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:minioadmin123}
    region: ${AWS_REGION:us-east-1}
    bucket-name: ${AWS_S3_BUCKET_NAME:blogverse-media}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:true}

media:
  allowed-image-types: image/jpeg,image/png,image/gif,image/webp
  allowed-video-types: video/mp4,video/webm,video/ogg
  max-image-size-mb: 10
  max-video-size-mb: 100

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.blogverse.media: DEBUG
    root: INFO

